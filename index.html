<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ag Spray Calculator</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="Agricultural spray mixing calculator for precise chemical application" />
    <meta name="theme-color" content="#498a5a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SprayCalc" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json?v=2" />

    <!-- PWA Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <!-- SprayCalc loader keyframes. Lives here (not in index.css) so the boot
         splash below animates before the JS bundle loads; the React
         <LogoLoader> in src/components/Logo.tsx reuses these classes.
         Loop: + then x then = light up like tapped keys, the drop pops
         bigger than the keys (the answer), all hold, then dim. -->
    <style>
      .sc-loader .sc-k, .sc-loader .sc-drop {
        transform-box: fill-box; transform-origin: center;
        animation-duration: 1.8s; animation-iteration-count: infinite;
        animation-timing-function: ease-out;
      }
      .sc-loader .sc-k, .sc-loader .sc-drop { opacity: .4; }
      .sc-loader .sc-k1 { animation-name: sc-k1; }
      .sc-loader .sc-k2 { animation-name: sc-k2; }
      .sc-loader .sc-k3 { animation-name: sc-k3; }
      .sc-loader .sc-drop { animation-name: sc-drop; }
      @keyframes sc-k1 { 0% { opacity: .4; transform: scale(1); } 4% { opacity: 1; transform: scale(1.12); } 10%, 72% { opacity: 1; transform: scale(1); } 84%, 100% { opacity: .4; } }
      @keyframes sc-k2 { 0%, 11% { opacity: .4; transform: scale(1); } 15% { opacity: 1; transform: scale(1.12); } 21%, 72% { opacity: 1; transform: scale(1); } 84%, 100% { opacity: .4; } }
      @keyframes sc-k3 { 0%, 22% { opacity: .4; transform: scale(1); } 26% { opacity: 1; transform: scale(1.12); } 32%, 72% { opacity: 1; transform: scale(1); } 84%, 100% { opacity: .4; } }
      @keyframes sc-drop { 0%, 35% { opacity: .4; transform: scale(1); } 41% { opacity: 1; transform: scale(1.32); } 49% { transform: scale(.95); } 55% { transform: scale(1.04); } 60%, 72% { opacity: 1; transform: scale(1); } 84%, 100% { opacity: .4; } }
      @media (prefers-reduced-motion: reduce) {
        .sc-loader .sc-k, .sc-loader .sc-drop { animation: none; }
        .sc-loader .sc-k, .sc-loader .sc-drop { opacity: 1; }
      }
      #boot-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #ffffff; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Boot splash: shown until React mounts and replaces #root. -->
      <div id="boot-splash" role="status" aria-label="Loading SprayCalc">
        <svg class="sc-loader" viewBox="0 0 512 512" width="96" height="96" aria-hidden="true">
          <rect width="512" height="512" rx="80" fill="#498a5a"/>
          <g fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round">
            <path class="sc-k sc-k1" d="M112 160H208M160 112V208"/>
            <path class="sc-k sc-k2" d="M318 126L386 194M386 126L318 194"/>
            <path class="sc-k sc-k3" d="M112 332H208M112 376H208"/>
          </g>
          <g class="sc-drop"><path fill="#fff" transform="translate(352 354) scale(.34) translate(-256 -273)" d="M256 96C256 96 388 230 388 318C388 392 326 450 256 450C186 450 124 392 124 318C124 230 256 96 256 96Z"/></g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
